<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="420" fill="#f4f1ea"/>
  <text x="48" y="46" font-size="23" font-weight="700" fill="#16130f">一个词，四重身份</text>
  <line x1="48" y1="64" x2="1152" y2="64" stroke="#ded8cc"/>

  <g>
    <rect x="48" y="92" width="262" height="270" fill="#fbf9f4" stroke="#ded8cc"/>
    <circle cx="76" cy="124" r="7" fill="#d9431f"/>
    <text x="96" y="130" font-size="18" font-weight="700" fill="#16130f">量词</text>
    <text x="66" y="176" font-size="14" fill="#4c463e">一点点，不多</text>
    <text x="66" y="214" font-size="13" fill="#6a6257">1 条头条 · 2 篇次条</text>
    <text x="66" y="238" font-size="13" fill="#6a6257">2 部连载 · 24 篇随笔</text>
    <text x="66" y="274" font-size="13" fill="#6a6257">不铺满首屏，不配题图</text>
    <text x="66" y="320" font-size="12" fill="#b8361a" font-family="Menlo, monospace">01 / 02 / 03</text>
  </g>
  <g>
    <rect x="326" y="92" width="262" height="270" fill="#fbf9f4" stroke="#ded8cc"/>
    <circle cx="354" cy="124" r="7" fill="#d9431f"/>
    <text x="374" y="130" font-size="18" font-weight="700" fill="#16130f">动作</text>
    <text x="344" y="176" font-size="14" fill="#4c463e">点一下，笔尖落下去</text>
    <text x="344" y="214" font-size="13" fill="#6a6257">涟漪 3.8s 荡开一圈</text>
    <text x="344" y="238" font-size="13" fill="#6a6257">星盘点击回两圈脉冲</text>
    <text x="344" y="274" font-size="13" fill="#6a6257">进度珠在簇里挪动</text>
    <text x="344" y="320" font-size="12" fill="#b8361a" font-family="Menlo, monospace">CLEAR = 38</text>
  </g>
  <g>
    <rect x="604" y="92" width="262" height="270" fill="#fbf9f4" stroke="#ded8cc"/>
    <circle cx="632" cy="124" r="7" fill="#d9431f"/>
    <text x="652" y="130" font-size="18" font-weight="700" fill="#16130f">图形</text>
    <text x="622" y="176" font-size="14" fill="#4c463e">一枚圆</text>
    <text x="622" y="214" font-size="13" fill="#6a6257" font-family="Menlo, monospace">--zhu #d9431f</text>
    <text x="622" y="238" font-size="13" fill="#6a6257">14px / .19em / 8px / 7px</text>
    <text x="622" y="274" font-size="13" fill="#6a6257">明暗各一套，尺寸跟着位置</text>
    <text x="622" y="320" font-size="12" fill="#b8361a" font-family="Menlo, monospace">r = 21px</text>
  </g>
  <g>
    <rect x="882" y="92" width="270" height="270" fill="#fbf9f4" stroke="#ded8cc"/>
    <circle cx="910" cy="124" r="7" fill="#d9431f"/>
    <text x="930" y="130" font-size="18" font-weight="700" fill="#16130f">态度</text>
    <text x="900" y="176" font-size="14" fill="#4c463e">克制，能量得出来</text>
    <text x="900" y="214" font-size="13" fill="#6a6257">删一层框线</text>
    <text x="900" y="238" font-size="13" fill="#6a6257">少一个请求 / 一个字重</text>
    <text x="900" y="274" font-size="13" fill="#6a6257">少一个品类后缀</text>
    <text x="900" y="320" font-size="12" fill="#b8361a" font-family="Menlo, monospace">1.57MB → 170KB</text>
  </g>

  <text x="48" y="396" font-size="14" fill="#16130f">四样叠在同一个词上，它才管得住名字、图标、交互和内容。</text>
  <circle cx="1142" cy="400" r="5" fill="#d9431f"/>
</svg>
