<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="400" fill="#f4f1ea"/>
  <text x="48" y="46" font-size="22" font-weight="700" fill="#16130f">「在后面」的两种读法</text>
  <line x1="48" y1="62" x2="1152" y2="62" stroke="#ded8cc"/>

  <!-- 左：竖排 -->
  <text x="48" y="98" font-size="15" fill="#6a6257" letter-spacing="2">纵向顺序 · 上下叠</text>
  <rect x="48" y="116" width="470" height="240" fill="#fbf9f4" stroke="#ded8cc"/>
  <circle cx="420" cy="176" r="46" fill="none" stroke="#16130f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <ellipse cx="420" cy="286" rx="54" ry="26" fill="none" stroke="#16130f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g fill="#16130f">
    <circle cx="400" cy="162" r="2"/><circle cx="424" cy="158" r="2"/><circle cx="442" cy="178" r="2"/>
    <circle cx="396" cy="192" r="2"/><circle cx="430" cy="200" r="2"/><circle cx="412" cy="214" r="2"/>
    <circle cx="388" cy="280" r="2"/><circle cx="410" cy="272" r="2"/><circle cx="436" cy="278" r="2"/>
    <circle cx="452" cy="292" r="2"/><circle cx="400" cy="298" r="2"/>
  </g>
  <circle cx="420" cy="176" r="5" fill="#d9431f"/>
  <text x="70" y="150" font-size="13" fill="#4c463e">潮汐之境</text>
  <text x="70" y="292" font-size="13" fill="#4c463e">夜航星海</text>
  <text x="70" y="332" font-size="12" fill="#b8361a" font-family="Menlo, monospace">刊头高 350px</text>

  <!-- 箭头 -->
  <line x1="540" y1="236" x2="630" y2="236" stroke="#d9431f" stroke-width="1.5"/>
  <path d="M630 236 l-12 -6 v12 z" fill="#d9431f"/>
  <text x="585" y="220" font-size="12" fill="#b8361a" text-anchor="middle">改</text>

  <!-- 右：并排 -->
  <text x="672" y="98" font-size="15" fill="#6a6257" letter-spacing="2">同一行 · 左右相邻</text>
  <rect x="672" y="116" width="480" height="240" fill="#fbf9f4" stroke="#ded8cc"/>
  <circle cx="856" cy="228" r="64" fill="none" stroke="#16130f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <ellipse cx="1010" cy="228" rx="76" ry="34" fill="none" stroke="#16130f" stroke-width="1.5" stroke-dasharray="2 4"/>
  <g fill="#16130f">
    <circle cx="834" cy="204" r="2"/><circle cx="864" cy="196" r="2"/><circle cx="890" cy="214" r="2"/>
    <circle cx="828" cy="240" r="2"/><circle cx="870" cy="252" r="2"/><circle cx="900" cy="244" r="2"/>
    <circle cx="972" cy="216" r="2"/><circle cx="1004" cy="208" r="2"/><circle cx="1040" cy="220" r="2"/>
    <circle cx="984" cy="240" r="2"/><circle cx="1024" cy="246" r="2"/>
  </g>
  <circle cx="856" cy="228" r="6" fill="#d9431f"/>
  <text x="700" y="150" font-size="13" fill="#4c463e">潮汐向左让位</text>
  <text x="700" y="332" font-size="12" fill="#b8361a" font-family="Menlo, monospace">刊头高 168px</text>
  <line x1="792" y1="312" x2="1086" y2="312" stroke="#ded8cc" stroke-dasharray="3 3"/>
  <text x="939" y="306" font-size="11" fill="#6a6257" text-anchor="middle" font-family="Menlo, monospace">168 + gap + 168 ≈ 360 / 右栏 470</text>

  <line x1="48" y1="374" x2="1152" y2="374" stroke="#ded8cc"/>
  <text x="48" y="394" font-size="12" fill="#6a6257" font-family="Menlo, monospace">V10.17 · masthead-orbs: flex / justify-content: flex-end</text>
  <circle cx="1142" cy="390" r="5" fill="#d9431f"/>
</svg>
