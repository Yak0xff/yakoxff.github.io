<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="620" fill="#f4f1ea"/>
  <text x="48" y="50" font-size="23" font-weight="700" fill="#16130f">一张纸的调墨、字样与尺子</text>
  <line x1="48" y1="68" x2="1152" y2="68" stroke="#ded8cc" stroke-width="1"/>

  <!-- 左：色卡 -->
  <text x="48" y="108" font-size="15" fill="#6a6257" letter-spacing="2">色 · 三格</text>
  <rect x="48" y="126" width="96" height="96" fill="#f4f1ea" stroke="#ded8cc"/>
  <rect x="160" y="126" width="96" height="96" fill="#16130f"/>
  <rect x="272" y="126" width="96" height="96" fill="#d9431f"/>
  <g font-size="12" fill="#4c463e" font-family="Menlo, monospace">
    <text x="48" y="242">#f4f1ea</text><text x="160" y="242">#16130f</text><text x="272" y="242">#d9431f</text>
  </g>
  <text x="48" y="288" font-size="15" fill="#6a6257" letter-spacing="2">墨 · 四级</text>
  <g font-size="13" fill="#fbf9f4">
    <rect x="48" y="304" width="320" height="34" fill="#16130f"/><text x="60" y="326">标题</text>
  </g>
  <rect x="48" y="342" width="320" height="34" fill="#2c2721"/>
  <rect x="48" y="380" width="320" height="34" fill="#4c463e"/>
  <rect x="48" y="418" width="320" height="34" fill="#6a6257"/>
  <g font-size="13" fill="#fbf9f4">
    <text x="60" y="364">正文</text><text x="60" y="402">引文</text><text x="60" y="440">图注</text>
  </g>
  <g font-size="11" fill="#6a6257" font-family="Menlo, monospace">
    <text x="310" y="326">17.6:1</text><text x="310" y="364">13.4:1</text><text x="310" y="402">8.6:1</text><text x="310" y="440">5.3:1</text>
  </g>

  <line x1="400" y1="100" x2="400" y2="570" stroke="#ded8cc"/>

  <!-- 中：字阶 -->
  <text x="432" y="108" font-size="15" fill="#6a6257" letter-spacing="2">字 · 从 360 到 1440 线性插值</text>
  <g font-family="Menlo, monospace" font-size="11" fill="#6a6257">
    <text x="432" y="140">--step--2</text><text x="432" y="180">--step--1</text><text x="432" y="222">--step-0</text>
    <text x="432" y="266">--step-1</text><text x="432" y="312">--step-2</text><text x="432" y="360">--step-3</text>
    <text x="432" y="410">--step-4</text><text x="432" y="462">--step-5</text>
  </g>
  <g fill="#16130f">
    <rect x="432" y="146" width="52" height="8"/><rect x="432" y="186" width="70" height="10"/>
    <rect x="432" y="228" width="94" height="12"/><rect x="432" y="272" width="126" height="16"/>
    <rect x="432" y="318" width="166" height="20"/><rect x="432" y="366" width="214" height="26"/>
    <rect x="432" y="416" width="272" height="32"/><rect x="432" y="468" width="330" height="40"/>
  </g>
  <g font-family="Menlo, monospace" font-size="11" fill="#b8361a">
    <text x="492" y="155">.72rem</text><text x="510" y="196">.82</text><text x="534" y="240">1.00</text>
    <text x="566" y="285">1.18</text><text x="606" y="333">1.40</text><text x="654" y="387">1.70</text>
    <text x="712" y="441">2.10</text><text x="770" y="495">7.20rem</text>
  </g>
  <text x="432" y="540" font-size="13" fill="#4c463e">黑体立骨 · 楷体说话 · 等宽记账</text>

  <line x1="800" y1="100" x2="800" y2="570" stroke="#ded8cc"/>

  <!-- 右：栏宽 -->
  <text x="832" y="108" font-size="15" fill="#6a6257" letter-spacing="2">尺 · 宽度都从版心量起</text>
  <rect x="832" y="132" width="320" height="86" fill="none" stroke="#16130f" stroke-width="1"/>
  <rect x="832" y="132" width="262" height="86" fill="#ebe6dc"/>
  <text x="840" y="156" font-size="12" fill="#16130f">外壳 1200px</text>
  <text x="840" y="196" font-size="12" fill="#4c463e">正文 980px</text>
  <text x="1100" y="196" font-size="12" fill="#b8361a" text-anchor="end">160px</text>

  <text x="832" y="262" font-size="15" fill="#6a6257" letter-spacing="2">刊头 8fr : 4fr</text>
  <rect x="832" y="278" width="205" height="30" fill="#16130f"/>
  <rect x="1045" y="278" width="107" height="30" fill="#d9431f" opacity=".82"/>
  <text x="840" y="299" font-size="12" fill="#f4f1ea">刊语 · 两颗球</text>
  <text x="1098" y="299" font-size="12" fill="#fffaf6" text-anchor="middle">此刻</text>

  <text x="832" y="356" font-size="15" fill="#6a6257" letter-spacing="2">阅读页：标题跟着 --rd-measure</text>
  <rect x="832" y="372" width="262" height="54" fill="none" stroke="#16130f"/>
  <line x1="832" y1="392" x2="1094" y2="392" stroke="#b8361a" stroke-dasharray="3 3"/>
  <line x1="832" y1="412" x2="1094" y2="412" stroke="#b8361a" stroke-dasharray="3 3"/>
  <text x="840" y="388" font-size="11" fill="#16130f">标题 980 / 864 / 684</text>
  <text x="840" y="420" font-size="11" fill="#4c463e">左右边界差 0 · 距目录 24px</text>

  <text x="832" y="480" font-size="15" fill="#6a6257" letter-spacing="2">换算</text>
  <text x="832" y="510" font-size="13" fill="#16130f" font-family="Menlo, monospace">clamp(min, base + vw, max)</text>
  <text x="832" y="536" font-size="13" fill="#4c463e">明暗两套只换变量的值，不换结构</text>

  <line x1="48" y1="578" x2="1152" y2="578" stroke="#ded8cc"/>
  <text x="48" y="604" font-size="12" fill="#6a6257" font-family="Menlo, monospace">V10 · tokens / scale / measure</text>
  <circle cx="1142" cy="600" r="5" fill="#d9431f"/>
</svg>
