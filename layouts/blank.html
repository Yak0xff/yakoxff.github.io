{{ define "main" }}
    <article class="flex flex-col justify-center items-center"
        style="height: calc(100dvh - var(--page-margin-y) * 2)">
        {{ partial "components/mark" (dict "id" "mk-blank" "size" "8rem") }}
        <div class="markdown-body font-mono text-sm">
            {{ .Content }}
        </div>
        <p class="text-secondary font-mono">* * *</p>
    </article>
{{ end }}
