{{ $isWeekly := (eq .Params.categories "稻草人周刊") }}
<li class="post-row{{ if $isWeekly }} weekly{{ end }}">
    <a class="post-row-title" href="{{ .RelPermalink }}">
        {{ .Title }}{{ with .Params.subtitle }}<span class="post-row-sub">：{{ . }}</span>{{ end }}
    </a>
    <span class="post-row-leader" aria-hidden="true"></span>
    <time class="post-row-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-1-2" }}</time>
</li>
