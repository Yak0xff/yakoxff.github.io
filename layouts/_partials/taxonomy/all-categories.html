<!-- 文章系列：Bento cell 卡（hairline + crop mark 语言） -->
<ul class="series-list">
{{ range sort .Site.Taxonomies.categories ".Count" "desc" }}
    <li class="series-item">
        <a href="{{ .Page.RelPermalink }}"
            style="view-transition-name: category-{{ .Page.Title }};">
            <h3 class="series-item-name">{{ .Page.LinkTitle }}</h3>
            {{ with .Page.Params.description | markdownify }}
            <p class="series-item-desc">{{ . }}</p>
            {{ end }}
        </a>
    </li>
{{ end }}
</ul>

<a class="series-more" href="/categories/uncategorized/">
    查看随笔 <span aria-hidden="true">→</span>
</a>
