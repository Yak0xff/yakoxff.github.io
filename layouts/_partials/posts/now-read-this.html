{{ with site.RegularPages.Related . | first 1 }}
<div class="now-read-this">
  <span class="now-read-label">{{ T "nowReadThis" }}</span>
  {{ range . }}
  <a class="now-read-link" href="{{ .RelPermalink }}">
    <div class="now-read-content">
      <h4 class="now-read-title">
        {{ .LinkTitle }}
        {{ with .Params.subtitle }}
        <span class="now-read-subtitle">{{ . }}</span>
        {{ end }}
      </h4>
      <p class="now-read-summary">{{ .Summary | plainify | truncate 120 }}</p>
    </div>
    <span class="now-read-time">{{ .ReadingTime }} 分钟</span>
  </a>
  {{ end }}
</div>

{{ end }}
