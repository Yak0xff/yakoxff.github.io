{{/*
  文末操作条（V10.3）
  评论 / 复制链接 / 分享 / 赞助，图标改为内联 SVG（随主题变色），按钮 ≥ 44px。
  评论脚本（scripts/action-menu-js.html）依赖的三个 ID 不变：
    #comments-toggle  #comment-count  #comments-section
  复制 / 分享由 assets/js/reading.js 接管（data-rd-copy / data-rd-share）。
*/}}
<div id="action-menu" class="action-menu rd-actions">
  <div class="rd-actions-row">
    <button type="button" class="rd-act rd-act--primary" id="comments-toggle" aria-controls="comments-section" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5A1.5 1.5 0 0 1 19 17h-7l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5Z"/></svg>
      <span>评论</span>
      <span class="rd-act-count num" id="comment-count">…</span>
    </button>
    <button type="button" class="rd-act" data-rd-copy>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <span data-rd-copy-label>复制链接</span>
    </button>
    <button type="button" class="rd-act" data-rd-share hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg>
      <span>分享</span>
    </button>
    <a class="rd-act rd-act--ghost" href="/sponsor/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5Z"/><path d="M17 10.5h1.2a2.3 2.3 0 0 1 0 4.6H16.6"/><path d="M9 3.5c-.8 1 .8 2 0 3M12.5 3.5c-.8 1 .8 2 0 3"/></svg>
      <span>请喝杯茶</span>
    </a>
  </div>

  <div class="comments-wrapper">
    <div class="comments-section hidden" id="comments-section">
      {{ partial "posts/comment.html" . }}
    </div>
  </div>
</div>
