baseURL: https://yakoxff.pages.dev/
timeZone: Asia/Shanghai
hasCJKLanguage: true
defaultContentLanguage: zh
defaultContentLanguageInSubdir: true

# 明确指定布局目录
layoutDir: layouts
# 确保短代码路径正确
shortcodeDir: layouts/_shortcodes

# 自定义 URL 路径
permalinks:
  web: /web/:slug/

outputs:
  home:
    - HTML
    - RSS
    - Sitemap


# 安全设置，允许内联短代码
security:
  enableInlineShortcodes: true

# 相关内容权重（修好文末「接下来读什么」——此前未配置，26 篇中 4 篇推空）
related:
  threshold: 40
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: title
      weight: 20

# 排除以下划线开头的 Markdown 文件
exclude:
  - "**/_*.md"
  - "**/_*.markdown"
  - "content/fictions/草台班子/_大纲.md"
