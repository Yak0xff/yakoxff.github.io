baseURL: https://yakoxff.pages.dev/
timeZone: Asia/Shanghai
hasCJKLanguage: true
defaultContentLanguage: zh
defaultContentLanguageInSubdir: true

# 明确指定布局目录
layoutDir: layouts
# 确保短代码路径正确
shortcodeDir: layouts/_shortcodes

# GEO：为 AI 答案引擎输出结构化索引与纯文本全文。
# 两个自定义输出格式都挂在首页，模板见 layouts/index.llms.txt
# 与 layouts/index.llmsfull.txt；新增文章会自动进入索引。
outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
  LLMSFULL:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true

outputs:
  home:
    - HTML
    - RSS
    - Sitemap
    - LLMS
    - LLMSFULL


# 安全设置，允许内联短代码
security:
  enableInlineShortcodes: true

# 相关内容权重（修好文末「接下来读什么」——此前未配置，26 篇中 4 篇推空）
related:
  threshold: 40
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 80
    - name: title
      weight: 20

# 排除以下划线开头的 Markdown 文件
exclude:
  - "**/_*.md"
  - "**/_*.markdown"
  - "content/fictions/草台班子/_大纲.md"
