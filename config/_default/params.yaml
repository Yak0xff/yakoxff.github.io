author: Yak0xff
email: hi@guhub.cn
description: "一点 · 独立写作。记录一个普通人在加速时代里的观察、误判与重新校准，关于技术、思考与生活。"
twitter: zh_robin
author_twitter: zh_robin
favicon: /favicon.ico
# 默认的社交媒体分享图片
# V10.25：换到 /share/ + 版本号文件名。X 按图片 URL 长期缓存卡片，
# 且 _headers 给 /img/* 设了 30 天缓存，旧 /img/header.png 换了内容
# 也不会被重新抓取；换新 URL 才会出新的 Twitter Card。
# V10.30：全站正文改系统宋体后，卡片的标语 / 分类小字同步换宋体，
# 内容一变就递增到 v3；v2 保留兼容旧分享链接。
default_og_image: /share/og-card-v3.png
mainSections:
  - posts
  - fictions
  - library
# 需要从 static 引入的外部脚本（键名沿用历史拼写，Hugo 不区分大小写）
# littlefoot 已移除：全站没有脚注用法，却每页加载 10KB 脚本
externalJSFiles: []
footerExternalLinks:
  - name: GitHub
    link: https://github.com/Yak0xff/
    icon: /img/github.png
  - name: Travelling
    link: https://www.travellings.cn/go.html
    icon: https://www.travellings.cn/assets/favicon.png
  - name: X
    link: https://x.com/zh_robin
    icon: /img/x.png
# ------------------------------------------------------------------
# 重构新增能力开关
# 全部为增量能力，置 false 即回退到重构前行为，不影响文章数据与 URL
# ------------------------------------------------------------------
features:
  homeHero: true          # 首页 Hero（主张横幅 + 数据 + 当前状态）
  topicCount: 3           # 按主题读展示的主题数（三列一行；不足 3 篇时允许回补文章流里的文章）
  restCount: 12           # 「更早以前」列表条数
  revealOnScroll: true    # 滚动进场动效（自动尊重 prefers-reduced-motion）
  reader:
    progress: true        # 顶部阅读进度条
    tocDrawer: true       # 移动端 TOC 抽屉
    preferences: true     # 阅读偏好面板（字号/行距/栏宽）
    shortcuts: true       # 键盘快捷键
    related: 3            # 文末相关推荐条数（0 表示关闭）

# 首页 Hero 文案（留空则回退到站点 description）
home:
  kicker: "一个人的编辑部"
  claim: "世界不会等你准备好。写下来，就是在时间里刻下坐标。"
  claimNote: "这里记录一个普通人在加速时代里的观察、误判与重新校准。"
giscus:
  repo: Yak0xff/yakoxff.github.io
  repoId: R_kgDOPv9iUg
  category: General
  categoryId: DIC_kwDOPv9iUs4Cvcyk
  mapping: og:title
  strict: 1
  reactionsEnabled: 0
  emitMetadata: 0
  inputPosition: top
  theme: "https://yakoxff.pages.dev/css/giscus_noborder.css"
